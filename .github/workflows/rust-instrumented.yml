name: Rust Instrumented

# Concurrency control:
# - PRs: new commits on a feature branch will cancel in-progress (outdated) runs.
# - Push to develop: runs queue sequentially, never cancelled.
# - `workflow_dispatch`: groups by branch and queues if run on develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}
on:
  push:
    branches: [develop]
  pull_request: { }
  workflow_dispatch: { }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NIGHTLY_TOOLCHAIN: nightly-2026-09-10

jobs:
  duckdb-mirror:
    name: "Mirror DuckDB to R2"
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/duckdb-r2.yml
    secrets: inherit

  duckdb-ready:
    name: "DuckDB libraries available in R2"
    needs: duckdb-mirror
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify DuckDB mirror
        if: ${{ needs.duckdb-mirror.result == 'failure' }}
        run: |
          echo "DuckDB mirror failed"
          exit 1

  rust-coverage:
    name: "Rust tests (coverage) (${{ matrix.suite }})"
    needs: duckdb-ready
    # An instrumented build and run of the whole workspace does not fit in thirty
    # minutes without the prebuild image and its compile cache.
    timeout-minutes: ${{ github.repository == 'vortex-data/vortex' && 30 || 75 }}
    permissions:
      id-token: write
    strategy:
      matrix:
        include:
          - suite: tests
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-large/volume=200gb/image=ubuntu24-full-x64-pre-v2/tag=rust-coverage-suite-{1}', github.run_id, matrix.suite)
          || 'ubuntu-latest' }}
    env:
      RUSTFLAGS: "-Cinstrument-coverage -A warnings"
      CARGO_INCREMENTAL: 0  # Disable incremental compilation to get accurate coverage
      LLVM_PROFILE_FILE: "target/coverage/vortex-%p-%m.profraw"
      GRCOV_OUTPUT_FILE: "target/coverage/vortex.lcov"
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Free disk space
        if: github.repository != 'vortex-data/vortex'
        shell: bash
        # Upstream requests disk=large for this job. A GitHub-hosted runner has far
        # less, and an instrumented build of the whole workspace fills it.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Ensure llvm-tools are installed
        run: |
          rustup component add llvm-tools || \
            rustup component add llvm-tools-preview

          # Verify llvm-profdata is accessible (grcov needs it for coverage merging)
          RUST_SYSROOT="$(rustc --print sysroot)"
          RUST_HOST="$(rustc --print host-tuple)"
          LLVM_TOOLS_BIN="${RUST_SYSROOT}/lib/rustlib/${RUST_HOST}/bin"
          LLVM_PROFDATA="${LLVM_TOOLS_BIN}/llvm-profdata"
          if [ ! -f "$LLVM_PROFDATA" ]; then
            echo "ERROR: llvm-profdata not found at $LLVM_PROFDATA"
            echo "Listing bin directory:"
            ls -la "$LLVM_TOOLS_BIN" || echo "Directory does not exist"
            exit 1
          fi
          echo "Found llvm-profdata at $LLVM_PROFDATA"

      - name: Install grcov
        if: github.repository != 'vortex-data/vortex'
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9  # v2
        with:
          tool: grcov

      - name: Rust Tests
        if: ${{ matrix.suite == 'tests' }}
        run: |
          cargo nextest run --profile coverage --locked --workspace --all-features --no-fail-fast --exclude vortex-python-cuda
      - name: Generate coverage report
        run: |
          RUST_SYSROOT="$(rustc --print sysroot)"
          RUST_HOST="$(rustc --print host-tuple)"
          LLVM_TOOLS_BIN="${RUST_SYSROOT}/lib/rustlib/${RUST_HOST}/bin"
          grcov . --binary-path target/debug/ -s . -t lcov --llvm --ignore-not-existing \
            --llvm-path "${LLVM_TOOLS_BIN}" \
            --threads $(nproc) \
            --ignore '../*' --ignore '/*' --ignore 'fuzz/*' --ignore 'vortex-bench/*' \
            --ignore 'home/*' --ignore 'xtask/*' --ignore 'target/*' --ignore 'vortex-error/*' \
            --ignore 'vortex-python/*' --ignore 'vortex-jni/*' --ignore 'vortex-flatbuffers/*' \
            --ignore 'vortex-proto/*' --ignore 'vortex-tui/*' --ignore 'vortex-datafusion/examples/*' \
            --ignore 'vortex-ffi/examples/*' --ignore '*/arbitrary/*' --ignore '*/arbitrary.rs' \
            --ignore benchmarks/* --ignore 'vortex-test/*' \
            -o ${{ env.GRCOV_OUTPUT_FILE }}
          test -s ${{ env.GRCOV_OUTPUT_FILE }}
      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          name: run-${{ matrix.suite }}
          files: ${{ env.GRCOV_OUTPUT_FILE }}
          disable_search: true
          flags: ${{ matrix.suite }}
          use_oidc: true

  cxx-coverage:
    name: "C++ API (coverage)"
    timeout-minutes: 15
    permissions:
      id-token: write
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=cxx-coverage', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install lcov
        run: |
          if ! command -v lcov >/dev/null || ! dpkg-query -W libjson-xs-perl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lcov libjson-xs-perl
          fi
      - name: Build and test C++ API with coverage
        working-directory: lang/cpp
        run: ./gcov-report.sh
      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          name: cxx-api
          files: lang/cpp/coverage.info
          disable_search: true
          flags: cxx-api
          use_oidc: true

  rust-test-sanitizer:
    strategy:
      fail-fast: false
      matrix:
        include:
          # We don't run memory sanitizer as it provides many false positives
          # for std
          - sanitizer: asan
            sanitizer_flags: "-Zsanitizer=address,leak"
          - sanitizer: tsan
            sanitizer_flags: "-Zsanitizer=thread"
    name: "Rust tests (${{ matrix.sanitizer }})"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=rust-test-sanitizer', github.run_id)
          || 'ubuntu-latest' }}
    # -Zbuild-std with a sanitizer rebuilds core and std, which overran thirty
    # minutes on a fork runner with no compile cache.
    timeout-minutes: ${{ github.repository == 'vortex-data/vortex' && 30 || 90 }}
    env:
      ASAN_OPTIONS: "symbolize=1:check_initialization_order=1:detect_leaks=1:leak_check_at_exit=1"
      LSAN_OPTIONS: "report_objects=1"
      ASAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      MSAN_OPTIONS: "symbolize=1"
      MSAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      TSAN_OPTIONS: "symbolize=1:suppressions=${{ github.workspace }}/vortex-ffi/tsan_suppressions.txt"
      TSAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      VORTEX_SKIP_SLOW_TESTS: "1"
      # -Cunsafe-allow-abi-mismatch=sanitizer: libraries like compiler_builtins
      # unset -Zsanitizer flag and we should allow that.
      RUSTFLAGS: "-A warnings -Cunsafe-allow-abi-mismatch=sanitizer -C debuginfo=2 -C opt-level=0 -C strip=none"
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install Rust nightly toolchain
        run: |
          rustup toolchain install $NIGHTLY_TOOLCHAIN
          rustup component add --toolchain $NIGHTLY_TOOLCHAIN rust-src rustfmt clippy llvm-tools-preview
      - name: Provide llvm-symbolizer
        if: github.repository != 'vortex-data/vortex'
        shell: bash
        # The sanitizer env pins /usr/bin/llvm-symbolizer, which the prebuild image
        # supplies. Without it the sanitizers cannot resolve frames, and because
        # every entry in tsan_suppressions.txt matches on a symbol name, none of the
        # known-benign crossbeam and oneshot races get suppressed.
        run: |
          if [ ! -x /usr/bin/llvm-symbolizer ]; then
            SYM="$(command -v llvm-symbolizer || true)"
            if [ -z "$SYM" ]; then
              SYSROOT="$(rustc +$NIGHTLY_TOOLCHAIN --print sysroot)"
              SYM="$(find "$SYSROOT" -name llvm-symbolizer -type f 2>/dev/null | head -1)"
            fi
            if [ -z "$SYM" ]; then
              SYM="$(ls -1 /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -1 || true)"
            fi
            if [ -z "$SYM" ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq llvm
              SYM="$(command -v llvm-symbolizer || true)"
              if [ -z "$SYM" ]; then
                SYM="$(ls -1 /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -1 || true)"
              fi
            fi
            if [ -z "$SYM" ]; then
              echo "no llvm-symbolizer available; sanitizer suppressions match on symbol"
              echo "names, so the run would report known-benign races as failures"
              exit 1
            fi
            sudo ln -sf "$SYM" /usr/bin/llvm-symbolizer
          fi
          /usr/bin/llvm-symbolizer --version
      - name: Build tests with sanitizer
        run: |
          RUSTFLAGS="${RUSTFLAGS} ${{ matrix.sanitizer_flags }}" \
          cargo +$NIGHTLY_TOOLCHAIN build --tests --locked --all-features \
            --target x86_64-unknown-linux-gnu -Zbuild-std \
            -p vortex-buffer -p vortex-fastlanes -p vortex-fsst -p vortex-alp -p vortex-array

      - name: Run tests with sanitizer
        run: |
          RUSTFLAGS="${RUSTFLAGS} ${{ matrix.sanitizer_flags }}" \
          cargo +$NIGHTLY_TOOLCHAIN nextest run --locked --all-features --no-fail-fast \
            --target x86_64-unknown-linux-gnu -Zbuild-std \
            -p vortex-buffer -p vortex-fastlanes -p vortex-fsst -p vortex-alp -p vortex-array

        # cargo nextest reports less sanitizer issues than cargo test
        # --tests skips doctests: rustdoc ignores RUSTFLAGS (it uses RUSTDOCFLAGS),
        # so doctests would build vortex-ffi without -Zsanitizer and mismatch the
        # sanitizer-built deps.
      - name: Run vortex-ffi tests with sanitizer
        run: |
          RUSTFLAGS="${RUSTFLAGS} ${{ matrix.sanitizer_flags }}" \
          cargo +$NIGHTLY_TOOLCHAIN test --locked \
            --target x86_64-unknown-linux-gnu --no-fail-fast -Zbuild-std \
            -p vortex-ffi --tests -- --no-capture

  rust-ffi-test-sanitizer:
    strategy:
      fail-fast: false
      matrix:
        include:
          # We don't run memory sanitizer as it's clang-only and provides many
          # false positives for Catch2
          - sanitizer: asan
          - sanitizer: tsan
    name: "Rust/C++ FFI tests (${{ matrix.sanitizer }})"
    # Allow cold builds of Rust's sanitizer-instrumented standard library.
    # Sanitizer builds of vortex-ffi plus the C++ tests are built from scratch on a
    # fork, which does not fit in the upstream prebuild budget.
    timeout-minutes: ${{ github.repository == 'vortex-data/vortex' && 15 || 45 }}
    env:
      ASAN_OPTIONS: "symbolize=1:check_initialization_order=1:detect_leaks=1:leak_check_at_exit=1"
      LSAN_OPTIONS: "report_objects=1"
      ASAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      MSAN_OPTIONS: "symbolize=1"
      MSAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      TSAN_OPTIONS: "symbolize=1:suppressions=${{ github.workspace }}/vortex-ffi/tsan_suppressions.txt"
      TSAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      VORTEX_SKIP_SLOW_TESTS: "1"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/tag=rust-ffi-test-sanitizer', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: "rust-src, rustfmt, clippy, llvm-tools-preview"
      - name: Provide llvm-symbolizer
        if: github.repository != 'vortex-data/vortex'
        shell: bash
        # The sanitizer env pins /usr/bin/llvm-symbolizer, which the prebuild image
        # supplies. Without it the sanitizers cannot resolve frames, and because
        # every entry in tsan_suppressions.txt matches on a symbol name, none of the
        # known-benign crossbeam and oneshot races get suppressed.
        run: |
          if [ ! -x /usr/bin/llvm-symbolizer ]; then
            SYM="$(command -v llvm-symbolizer || true)"
            if [ -z "$SYM" ]; then
              SYSROOT="$(rustc +$NIGHTLY_TOOLCHAIN --print sysroot)"
              SYM="$(find "$SYSROOT" -name llvm-symbolizer -type f 2>/dev/null | head -1)"
            fi
            if [ -z "$SYM" ]; then
              SYM="$(ls -1 /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -1 || true)"
            fi
            if [ -z "$SYM" ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq llvm
              SYM="$(command -v llvm-symbolizer || true)"
              if [ -z "$SYM" ]; then
                SYM="$(ls -1 /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -1 || true)"
              fi
            fi
            if [ -z "$SYM" ]; then
              echo "no llvm-symbolizer available; sanitizer suppressions match on symbol"
              echo "names, so the run would report known-benign races as failures"
              exit 1
            fi
            sudo ln -sf "$SYM" /usr/bin/llvm-symbolizer
          fi
          /usr/bin/llvm-symbolizer --version
      - name: Build FFI library, tests, and examples
        working-directory: vortex-ffi
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DVORTEX_SANITIZER=${{ matrix.sanitizer }} \
            -DVORTEX_SANITIZE_RUST_STD=ON \
            -DVORTEX_BUILD_TESTS=ON \
            -DVORTEX_BUILD_EXAMPLES=ON
          cmake --build build --parallel "$(nproc)"
      - name: Run tests
        run: |
          set -o pipefail
          ./vortex-ffi/build/test/vortex_ffi_test
      - name: Run examples
        run: |
          set -o pipefail

          ./vortex-ffi/build/examples/write_sample file.vortex
          ./vortex-ffi/build/examples/write_sample file2.vortex
          ./vortex-ffi/build/examples/dtype '*.vortex'
          ./vortex-ffi/build/examples/scan '*.vortex'
          ./vortex-ffi/build/examples/scan_to_arrow '*.vortex'

  miri:
    name: "Rust tests (miri)"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/tag=rust-miri', github.run_id)
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-disable-isolation -Zmiri-env-forward=RUST_BACKTRACE
      RUSTFLAGS: "-A warnings"
      RUST_BACKTRACE: full
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install nightly with miri
        run: rustup toolchain install $NIGHTLY_TOOLCHAIN --component rust-src,rustfmt,clippy,miri
      - name: Run Miri
        run: cargo +$NIGHTLY_TOOLCHAIN miri nextest run --no-fail-fast -p vortex-buffer -p vortex-ffi
